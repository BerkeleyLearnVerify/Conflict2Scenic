[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "conflict-cases-to-scenic"
version = "0.1.0"
description = "Generate and run Scenic traffic conflict scenarios"
readme = "README.md"
requires-python = ">=3.8,<3.12"
dependencies = [
    "scenic[metadrive]>=3.1",
    "verifai>=2.2",
    "matplotlib>=3.7",
    "shapely>=2.0",
]

[project.scripts]
run-scenic-scenarios = "run_scenic_scenarios:main"

[tool.setuptools]
py-modules = ["run_scenic_scenarios"]
